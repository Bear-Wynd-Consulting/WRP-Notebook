# ─── Phase 1: llmster on host, notebook in Docker (default for development) ───
# Run LM Studio on the host first: lms server start --port 1234
# Then start the notebook container:
#   docker compose --profile local-dev --env-file .env.local up --build
# host.docker.internal is built-in on Docker Desktop (Windows/Mac).
# On Linux, the extra_hosts entry maps it to the host gateway.

# ─── Phase 2: fully self-contained ───────────────────────────────────────────
# llmster runs as a container alongside the notebook.
# GPU passthrough requires NVIDIA Container Toolkit on Linux.
# Not suitable for Apple Silicon (no Metal passthrough — CPU inference only).
#
# Usage: docker compose --profile phase2 --env-file .env.local up --build

services:
  # ── Local Postgres + pgvector (no profile — always started) ──────────────
  # Isolated dev database; keeps local testing off the shared Neon project.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notebook
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Neon WebSocket proxy shim ──────────────────────────────────────────────
  # @prisma/adapter-neon speaks Neon's wss:// proxy protocol, not plain
  # Postgres wire protocol. This shim translates it to the plain postgres
  # container above so lib/db/client.ts doesn't need a second adapter.
  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "true"
    ports:
      - "4444:80"
    depends_on:
      postgres:
        condition: service_healthy

  # ── OCR sidecar (handwritten/scanned PDF fallback) ────────────────────────
  # No profile — always started, like postgres/wsproxy, since the CPU-only
  # `stub`/`got-ocr2` engines are meant to run everywhere by default. See
  # docs/ocr-handwritten-pdf-evaluation.md for why this isn't folded into
  # llmster (LM Studio only speaks OpenAI-compatible chat/embeddings, not a
  # PDF-in/text-out contract).
  ocr:
    build: ./ocr
    ports:
      - "8000:8000"
    environment:
      OCR_ENGINE: "${OCR_ENGINE:-stub}"
    volumes:
      - ocr-model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Phase 2 llmster service ───────────────────────────────────────────────
  llmster:
    profiles: [phase2, ai-pc]
    image: lmstudio/llmster-preview:latest
    ports:
      - "1234:1234"
    volumes:
      - ~/.lmstudio/models:/root/.lmstudio/models
      - llmster-state:/root/.lmstudio/state
    command: >
      sh -c "
        lms daemon up &&
        lms load gemma-4-2b-it &&
        lms load embedding-gemma-300m &&
        lms server start --port 1234 --host 0.0.0.0 &&
        tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1234/api/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── Phase 2 notebook ──────────────────────────────────────────────────────
  notebook:
    profiles: [phase2]
    build: .
    ports:
      - "3000:3000"
    depends_on:
      llmster:
        condition: service_healthy
      wsproxy:
        condition: service_started
      ocr:
        condition: service_healthy
    env_file:
      - .env.local

  # ── AI-PC: pull pre-built notebook image from Docker Hub (no build needed) ──
  notebook-ai-pc:
    profiles: [ai-pc]
    image: wynderoem/wrp-notebook:latest
    ports:
      - "3000:3000"
    depends_on:
      llmster:
        condition: service_healthy
      wsproxy:
        condition: service_started
      ocr:
        condition: service_healthy
    env_file:
      - .env.local

  # ── Phase 1 notebook (local-dev profile) ──────────────────────────────────
  # LM Studio runs on the host; this service reaches it via host.docker.internal.
  # Required on Linux: the extra_hosts entry below maps the name.
  # On Docker Desktop (Mac/Windows) host.docker.internal is built in.
  notebook-local-dev:
    profiles: [local-dev]
    build: .
    ports:
      - "3000:3000"
    depends_on:
      wsproxy:
        condition: service_started
      ocr:
        condition: service_healthy
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  llmster-state:
  postgres-data:
  ocr-model-cache:
