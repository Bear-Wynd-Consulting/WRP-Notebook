name: Security Checks

on:
  push:
    branches: [main, "claude/*"]
  pull_request:

jobs:
  audit:
    name: npm audit + lockfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: lockfile-lint (npm registry only)
        run: npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Full history required for Gitleaks
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc87b15fbced62c0f7b6cc8d6c # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
