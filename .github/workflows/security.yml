name: Security Checks

on:
  push:
    branches: [main, "claude/*"]
  pull_request:

jobs:
  audit:
    name: npm audit + lockfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: lockfile-lint (npm registry only)
        run: npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history required for Gitleaks
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc87b15fbced62c0f7b6cc8d6c # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
